name: "WH_BOR_Trout"
output_dir: "../_site"

# render_site() turns every .Rmd and .md in this folder into a page unless the
# filename begins with an underscore. `exclude:` does NOT prevent that -- it
# controls which files are COPIED as site resources, nothing more. To keep a
# document out of the site, delete it, move it to docs/, or prefix it with "_".
# render_site.R stops if it finds a stray page here.
#
# *** DO NOT ADD `figures` TO THIS LIST. ***
# `exclude` governs what is COPIED INTO the output directory, not merely what is
# rendered as a page. Excluding `figures` stops manuscript/figures/ reaching
# _site/figures/, and since FIG() emits <img src="figures/x.png"> every image
# then 404s on the published site while the local preview still looks correct
# (the local pages resolve against manuscript/figures/, which does exist).
#
# Files beginning with "_" are excluded by render_site() automatically, so
# _common.R needs no entry either.
exclude:
  - "*.md"          # documentation lives in docs/, not here
  - "*.csv"
  - "*.rds"
  - "README*"
navbar:
  title: "Daily Flow & Montana Trout"
  left:
    - text: "Overview"
      href: index.html
    - text: "Methods"
      href: methods.html
    - text: "Results"
      href: results.html
    - text: "Among sites"
      href: results_among_sites.html
  right:
    - icon: fa-github
      text: "Source"
      href: https://github.com/YOUR-USERNAME/WH_BOR_Trout
output:
  html_document:
    theme: flatly
    highlight: tango
    toc: true
    toc_float:
      collapsed: false
    toc_depth: 2
    code_folding: hide
    df_print: kable
    self_contained: false
