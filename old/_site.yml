# =============================================================================
# manuscript/_site.yml -- the site's structure. Read by rmarkdown::render_site(),
# which render_site.R calls.
#
# WHAT THIS FILE CONTROLS, AND WHAT IT DOES NOT
# ---------------------------------------------
#   it DOES     the navbar, the output directory, the HTML theme, and which
#               files are COPIED into _site/ as resources
#   it does NOT decide which .Rmd files are RENDERED. render_site() renders
#               every .Rmd and .md in manuscript/ that does not start with "_",
#               whatever `exclude:` says. That is why render_site.R stops when a
#               stray document is sitting here: `exclude:` would not save you.
#
# THREE PAGES ARE HAND-WRITTEN AND LIVE IN manuscript/:
#   index.Rmd                 home: what the analysis is and how to read it
#   methods.Rmd               how beta(t) is estimated, gated and applied
#   results_among_sites.Rmd   the cross-site synthesis
#
# TWO ARE GENERATED BY render_site.R ON EVERY RUN -- do not edit them, and do
# not add them to version control:
#   results.Rmd               the site picker (dropdown + one row per site)
#   site_<SITE>.Rmd           one per active site, from _site_template.Rmd
#
# The per-site pages are deliberately NOT listed in the navbar below. The site
# list comes from CFG$sites$active and changes; a hand-maintained menu would go
# stale and 404. render_site.R puts a dropdown on every page instead, so a
# reader can jump between sites from anywhere.
# =============================================================================

name: "WH_BOR_Trout"
title: "Weighted hydrographs - daily streamflow and Montana brown trout"

# Relative to manuscript/. render_site.R cleans this directory before rendering
# and publish_site.sh pushes its contents to the gh-pages branch.
output_dir: "../_site"

# Each page renders in its OWN R session. Slower, and worth it: the per-site
# pages set SITE_FOCUS and then load that site's objects, so a shared session
# lets one site's leftovers satisfy a reference on the next page. That failure
# is invisible -- the page renders, with another site's numbers on it.
new_session: true

navbar:
  title: "Weighted hydrographs"
  type: default
  left:
    - text: "Home"
      href: index.html
    - text: "Methods"
      href: methods.html
    - text: "Results by site"
      href: results.html
    - text: "Among sites"
      href: results_among_sites.html
  # To link the repository, add a right: block with an href to its URL. Keep
  # any .html filename out of it -- render_site.R checks every .html in this
  # file against the pages it generates and flags ones that will 404.

output:
  html_document:
    theme: cosmo
    highlight: tango
    toc: true
    toc_depth: 2
    toc_float:
      collapsed: false
      smooth_scroll: false
    fig_caption: true
    df_print: kable
    # self_contained MUST stay false. TRUE base64-embeds every figure into every
    # page: the HTML balloons, and -- worse -- the images stop being real files,
    # so the broken-image checks in render_site.R, diagnose_site.R and
    # publish_site.sh all pass vacuously while the published site can still be
    # wrong. With false, figures are referenced as figures/<name>.png and copied
    # into _site/figures/, which is what those checks verify.
    self_contained: false
    lib_dir: site_libs

# Files and folders NOT copied into _site/. `figures` must never appear here:
# excluding it strands every image, and the LOCAL preview still looks correct
# because it resolves against manuscript/figures/. render_site.R refuses to
# render if it finds figures in this list.
exclude:
  - "*.Rproj"
  - "README.md"
  - "notes"
  - "drafts"

# Keep this key last: anything below an exclude: block that begins with "-" is
# read as part of it.
